# Cloudflare Pages + Pages Functions + D1 configuration
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
name = "family-tree"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

# D1 free plan: 500 MB per database, 5 GB total account storage.
# Create it with:  npx wrangler d1 create family-tree-db
# then replace database_id below with the id it prints
# (or copy it from Cloudflare dashboard > Storage & Databases > D1).
[[d1_databases]]
binding = "DB"
database_name = "family-tree-db"
database_id = "9dcbd8de-9a9f-415b-8c52-977f7324917a"
migrations_dir = "migrations"

# Secrets are NOT stored here. Set them in the dashboard
# (Pages project > Settings > Variables and Secrets) or with:
#   npx wrangler pages secret put ADMIN_PASSWORD
#   npx wrangler pages secret put SESSION_SECRET
# Optional plain variable:
# [vars]
# PBKDF2_ITERATIONS = "60000"
